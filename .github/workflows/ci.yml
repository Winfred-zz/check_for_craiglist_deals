name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q tests --junitxml=pytest-report.xml
      - name: Offline CLI smoke
        run: |
          python -B check_for_craiglist_deals.py --once \
            --csv tests/fixtures/offline-scan/smoke.csv \
            --fixture-dir tests/fixtures/offline-scan \
            --data-dir "$RUNNER_TEMP/cfd-data" \
            --log-dir "$RUNNER_TEMP/cfd-logs" \
            --at "2026-10-19T13:00:00Z"
      - name: Upload safe test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 3
